name: Auto Version Bump

# Retired. Bump + publish now run as the root jobs in `release.yml`
# so npm Trusted Publisher matches workflow filename `release.yml`.
# A nested `workflow_call` made npm see *this* file and return ENEEDAUTH.
on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Retired — merge a PR or run "Publish to npm"'
        required: false

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Auto Version Bump is retired. Use .github/workflows/release.yml."
          exit 1
