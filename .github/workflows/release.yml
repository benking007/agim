name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
  # Manual trigger — needed when an auto-version-bump commit lands on main.
  # GitHub Actions deliberately blocks bot commits (incl. github-actions[bot]
  # from the auto-version workflow) from triggering other workflows, so an
  # auto-bumped package.json never fires this push hook. Maintainers run
  # workflow_dispatch from the Actions UI (or the REST API) to publish.
  workflow_dispatch:

permissions:
  id-token: write # 必须：用于 OIDC 身份验证
  contents: read  # 必须：用于检出代码

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          # 双通道：
          # - 优先 OIDC trusted publishing（npmjs.com 上为 agim-cli 配置好后自动启用）
          # - 兜底 NPM_TOKEN（automation token，配 id-token:write 同样可带 provenance）
          # registry-url 让 setup-node 把 NODE_AUTH_TOKEN 注入到 ~/.npmrc
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check publish needed
        id: version
        run: |
          CURR_VERSION=$(jq -r '.version' package.json)
          PUBLISHED_VERSION=$(npm view agim-cli version 2>/dev/null || echo "none")
          if [ "$PUBLISHED_VERSION" != "$CURR_VERSION" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "version=$CURR_VERSION" >> $GITHUB_OUTPUT
            echo "published=$PUBLISHED_VERSION" >> $GITHUB_OUTPUT
          else
            echo "npm already has v$CURR_VERSION."
          fi

      - name: Install dependencies
        if: steps.version.outputs.changed == 'true'
        # --omit=optional skips @xenova/transformers (huge ONNX binary that
        # triggers "Exit handler never called!" in npm during postinstall).
        # End users still get it by default when running `npm install -g
        # agim-cli`; we only skip in CI because the publish artifact doesn't
        # need it (it's a runtime-only dep loaded via dynamic import).
        run: npm ci --omit=optional || npm install --omit=optional

      - name: Install web-app dependencies
        if: steps.version.outputs.changed == 'true'
        # src/web-app is a separate package (not a workspace), so the root
        # `npm ci` above doesn't reach it. Required since v1.2.26 wired
        # build:spa (cd src/web-app && tsc --noEmit && vite build) into the
        # main build script — without this step tsc fails with TS2688:
        # "Cannot find type definition file for 'vite/client'".
        working-directory: src/web-app
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build
        if: steps.version.outputs.changed == 'true'
        run: npm run build

      - name: Run tests
        if: steps.version.outputs.changed == 'true'
        run: npm test

      - name: Publish to npm
        if: steps.version.outputs.changed == 'true'
        # NOTE: `--provenance` is intentionally omitted. npm requires the
        # source repo to be public for sigstore provenance verification —
        # benking007/imhub is private (422 Unprocessable Entity). Re-add
        # `--provenance` once the repo is flipped to public; until then
        # we publish with the OIDC / NPM_TOKEN auth path but no sigstore
        # attestation. (Older 0.2.x / 0.3.x releases shipped the same way.)
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        if: steps.version.outputs.changed == 'true'
        run: |
          echo "✅ Published v${{ steps.version.outputs.version }} to npm" >> $GITHUB_STEP_SUMMARY