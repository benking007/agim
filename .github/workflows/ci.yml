name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any prior run on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Exercise the lowest Node version declared in package.json.
          node-version: '22.19.0'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Catch "git advanced, npm stuck" early (e.g. bot version bumps that
      # never fired Publish). Grace: 1 patch ahead is OK; ≥2 patches or any
      # minor/major drift fails the job so the gap cannot sit unnoticed.
      - name: npm ↔ package.json drift check
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        run: npm run check:npm-drift
        continue-on-error: ${{ github.event_name == 'pull_request' }}

      # ───── Backend (agim-cli) ─────
      # The committed lockfile resolves from registry.npmjs.org. Keep CI on
      # `npm ci` so dependency drift cannot change a passing build.
      # --omit=optional skips the heavy Transformers.js ONNX runtime, which
      # these tests don't exercise (end users still get it by default).
      #
      # --omit=optional also skips biome's platform CLI. Install that one
      # binary into an isolated prefix: running `npm install` in the project
      # root would make Arborist recalculate the whole dependency tree.
      - name: Install root dependencies
        run: |
          npm ci --omit=optional --no-audit --no-fund --legacy-peer-deps
          BIOME_VERSION="$(node -p "require('./node_modules/@biomejs/biome/package.json').version")"
          BIOME_DIR="$RUNNER_TEMP/agim-biome"
          npm install --prefix "$BIOME_DIR" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org "@biomejs/cli-linux-x64@$BIOME_VERSION"
          test -f "$BIOME_DIR/node_modules/@biomejs/cli-linux-x64/biome"
          echo "BIOME_BINARY=$BIOME_DIR/node_modules/@biomejs/cli-linux-x64/biome" >> "$GITHUB_ENV"

      - name: Backend typecheck
        run: npm run typecheck

      - name: Repository lint
        run: npm run lint

      - name: Backend test
        run: npm test
        env:
          LOG_LEVEL: error

      # ───── Frontend (src/web-app) ─────
      # M1 web rewrite stack — see /root/.claude/plans/web-web-web-web-ui-bug-...md.
      # The web-app project lives in its own Vite workspace with its own
      # deps + tsconfig. CI runs it as a separate npm root so the backend
      # build pipeline stays decoupled from the SPA build pipeline.
      - name: Install web-app dependencies
        run: npm --prefix src/web-app ci --no-audit --no-fund

      - name: Web-app typecheck
        run: npm --prefix src/web-app run typecheck

      # i18n parity gate — fails fast if any en/zh dictionary drifts
      # so a forgotten translation can't land alongside a feature.
      - name: Web-app i18n parity (en ⇄ zh)
        run: npm --prefix src/web-app run check-i18n

      - name: Web-app endpoint contracts
        run: npm run check:contracts

      - name: Web-app test (vitest)
        run: npm --prefix src/web-app test -- --run
        env:
          CI: 'true'

      - name: Web-app build
        run: npm --prefix src/web-app run build

      # ───── Backend full build (with web-app dist in place) ─────
      # Backend build copies frontend dist/* into dist/web/public/ in M5
      # (PR with the build-script wiring). Until then this is just the
      # backend's own `tsc + cp src/web/public`, kept on its own line so
      # the CI still validates it independently.
      - name: Backend build
        run: npm run build

      # ───── Node-only SQLite regressions ─────
      # Bun can't load better-sqlite3 in this project, so DB-backed Bun cases
      # skip intentionally. This gate runs both the built-memory smoke tests
      # and the shared persistence suites against the real native addon.
      - name: SQLite persistence regressions (node)
        run: npm run test:node
