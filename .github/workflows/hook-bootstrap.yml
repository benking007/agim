name: Hook stability bootstrap

on:
  push:
    branches: [refactor/web-hook-stability]

permissions:
  contents: write

concurrency:
  group: hook-stability-bootstrap
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/web-hook-stability
          fetch-depth: 0

      - name: Apply codemod and capture diagnostics
        id: codemod
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 scripts/hook-stability-codemod.py > .github/hook-stability-bootstrap.log 2>&1
          status=$?
          git diff --check >> .github/hook-stability-bootstrap.log 2>&1
          diff_status=$?
          if [ "$status" -eq 0 ] && [ "$diff_status" -ne 0 ]; then
            status=$diff_status
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit result or diagnostic log
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'refactor(web): stabilize effect dependencies'
            git push origin HEAD:refactor/web-hook-stability
          fi

      - name: Enforce codemod
        if: steps.codemod.outputs.status != '0'
        run: exit 1
