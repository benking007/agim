name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - 'package.json'

permissions:
  id-token: write # 必须：用于 OIDC 身份验证
  contents: read  # 必须：用于检出代码

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          # 双通道：
          # - 优先 OIDC trusted publishing（npmjs.com 上为 im-hub-pro 配置好后自动启用）
          # - 兜底 NPM_TOKEN（automation token，配 id-token:write 同样可带 provenance）
          # registry-url 让 setup-node 把 NODE_AUTH_TOKEN 注入到 ~/.npmrc
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check publish needed
        id: version
        run: |
          CURR_VERSION=$(jq -r '.version' package.json)
          PUBLISHED_VERSION=$(npm view im-hub-pro version 2>/dev/null || echo "none")
          if [ "$PUBLISHED_VERSION" != "$CURR_VERSION" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "version=$CURR_VERSION" >> $GITHUB_OUTPUT
            echo "published=$PUBLISHED_VERSION" >> $GITHUB_OUTPUT
          else
            echo "npm already has v$CURR_VERSION."
          fi

      - name: Install dependencies
        if: steps.version.outputs.changed == 'true'
        run: npm ci || npm install

      - name: Build
        if: steps.version.outputs.changed == 'true'
        run: npm run build

      - name: Run tests
        if: steps.version.outputs.changed == 'true'
        run: npm test

      - name: Publish to npm
        if: steps.version.outputs.changed == 'true'
        # --provenance 走 sigstore 签名供应链证明；OIDC trusted 与 automation
        # token 两条路径都支持（automation token 需配 id-token:write 权限，
        # 上面 permissions 块已给）。NODE_AUTH_TOKEN 仅当配置了 NPM_TOKEN
        # secret 时才有值，trusted publishing 启用后可以删掉 secret。
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        if: steps.version.outputs.changed == 'true'
        run: |
          echo "✅ Published v${{ steps.version.outputs.version }} to npm" >> $GITHUB_STEP_SUMMARY