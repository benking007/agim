name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install root dependencies
        shell: bash
        run: |
          npm ci --omit=optional --no-audit --no-fund --legacy-peer-deps --loglevel=error
          BIOME_VERSION=$(node -p "require('./node_modules/@biomejs/biome/package.json').version")
          npm install --no-save --no-package-lock --no-audit --no-fund --legacy-peer-deps --loglevel=error "@biomejs/cli-linux-x64@$BIOME_VERSION"
          test -f node_modules/@biomejs/cli-linux-x64/biome

      - name: Install web-app dependencies
        run: npm --prefix src/web-app ci --no-audit --no-fund --legacy-peer-deps --loglevel=error

      - name: Backend typecheck
        run: npm run typecheck

      - name: Backend lint
        run: npm run lint:ci

      - name: Backend test
        run: npm test
        env:
          LOG_LEVEL: error

      - name: Web-app verify
        run: npm --prefix src/web-app run verify
        env:
          CI: 'true'

      - name: Full build
        run: npm run build

      # The SQLite memory layer needs the Node better-sqlite3 runtime rather
      # than Bun's disabled fallback, so run these regressions after dist exists.
      - name: Node-only memory regressions
        run: npm run test:node

      - name: Package contents smoke test
        run: npm pack --dry-run
