name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      # One-time bootstrap for this refactoring branch. The next human commit
      # removes this step after the generated files land.
      - name: Bootstrap lockfiles and lint fix
        id: bootstrap
        continue-on-error: true
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/agim-development' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            python3 - <<'PY'
          from pathlib import Path

          test_path = Path('src/plugins/agents/opencode/http-adapter.test.ts')
          text = test_path.read_text()
          old = "    expect((messageHit?.body as Record<string, unknown>).agent).toBe('plan')"
          new = "    if (!messageHit) throw new Error('expected plan-mode message POST')\n    expect((messageHit.body as Record<string, unknown>).agent).toBe('plan')"
          count = text.count(old)
          if count == 1:
              test_path.write_text(text.replace(old, new))
          elif 'expected plan-mode message POST' not in text:
              raise SystemExit(f'unexpected lint target count: {count}')

          lock_path = Path('package-lock.json')
          lock = lock_path.read_text()
          lock_path.write_text(lock.replace(
              'http://mirrors.tencentyun.com/npm/',
              'https://registry.npmjs.org/',
          ))
          PY

            npm --prefix src/web-app install --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps --registry=https://registry.npmjs.org
            node -e "JSON.parse(require('node:fs').readFileSync('package-lock.json', 'utf8')); JSON.parse(require('node:fs').readFileSync('src/web-app/package-lock.json', 'utf8'))"
            if grep -R "mirrors.tencentyun.com" package-lock.json src/web-app/package-lock.json; then
              echo 'internal mirror URL remains in a lockfile' >&2
              exit 1
            fi
            git diff --check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json src/web-app/package-lock.json src/plugins/agents/opencode/http-adapter.test.ts
            if ! git diff --cached --quiet; then
              git commit -m 'build: normalize lockfiles and fix lint regression'
              git push origin HEAD:codex/agim-development
            fi
          ) > /tmp/bootstrap.log 2>&1
          status=$?
          cat /tmp/bootstrap.log
          exit "$status"

      - name: Report bootstrap diagnostics
        if: steps.bootstrap.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          {
            echo '<!-- agim-ci-bootstrap -->'
            echo '### One-time bootstrap failed'
            echo
            echo '```text'
            tail -n 120 /tmp/bootstrap.log
            echo '```'
          } > /tmp/bootstrap-comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/bootstrap-comment.md

      - name: Enforce bootstrap
        if: steps.bootstrap.outcome == 'failure'
        run: exit 1

      # The old lockfile is normalized by the one-time bootstrap above. Until
      # that generated commit lands, keep the non-locking install path for this
      # bootstrap run itself.
      - name: Install root dependencies
        run: |
          npm install --omit=optional --no-package-lock --no-audit --no-fund --legacy-peer-deps --loglevel=error
          npm install --no-save --no-package-lock --no-audit --no-fund --legacy-peer-deps --loglevel=error @biomejs/cli-linux-x64 || true
          test -f node_modules/@biomejs/cli-linux-x64/biome

      - name: Install web-app dependencies
        run: npm --prefix src/web-app install --no-package-lock --no-audit --no-fund --legacy-peer-deps --loglevel=error

      - name: Backend typecheck
        run: npm run typecheck

      - name: Backend lint
        id: backend-lint
        continue-on-error: true
        shell: bash
        run: npm run lint > /tmp/backend-lint.log 2>&1

      - name: Report backend lint diagnostics
        if: steps.backend-lint.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          npm run lint -- --diagnostic-level=error --max-diagnostics=50 > /tmp/backend-lint-errors.log 2>&1 || true
          {
            echo '<!-- agim-ci-backend-lint -->'
            echo '### Backend lint failed'
            echo
            echo '```text'
            cat /tmp/backend-lint-errors.log
            echo '```'
          } > /tmp/backend-lint-comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/backend-lint-comment.md

      - name: Enforce backend lint
        if: steps.backend-lint.outcome == 'failure'
        run: exit 1

      - name: Backend test
        run: npm test
        env:
          LOG_LEVEL: error

      - name: Web-app verify
        run: npm --prefix src/web-app run verify
        env:
          CI: 'true'

      - name: Full build
        run: npm run build

      # The SQLite memory layer needs the Node better-sqlite3 runtime rather
      # than Bun's disabled fallback, so run these regressions after dist exists.
      - name: Node-only memory regressions
        run: npm run test:node

      - name: Package contents smoke test
        run: npm pack --dry-run
