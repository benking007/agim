name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      # The committed lockfile currently contains internal mirror URLs, so CI
      # must resolve from the public registry until that lockfile is regenerated.
      # Optional dependencies are omitted to avoid downloading the large local
      # embedding runtime; install Biome's platform binary explicitly because it
      # is itself optional.
      - name: Install root dependencies
        run: |
          npm install --omit=optional --no-package-lock --no-audit --no-fund --legacy-peer-deps --loglevel=error
          npm install --no-save --no-package-lock --no-audit --no-fund --legacy-peer-deps --loglevel=error @biomejs/cli-linux-x64 || true
          test -f node_modules/@biomejs/cli-linux-x64/biome

      - name: Install web-app dependencies
        run: npm --prefix src/web-app install --no-package-lock --no-audit --no-fund --legacy-peer-deps --loglevel=error

      - name: Backend typecheck
        run: npm run typecheck

      - name: Backend lint
        shell: bash
        run: |
          set +e
          npm run lint > /tmp/backend-lint.log 2>&1
          status=$?
          tail -n 120 /tmp/backend-lint.log
          exit "$status"

      - name: Backend test
        run: npm test
        env:
          LOG_LEVEL: error

      - name: Web-app verify
        run: npm --prefix src/web-app run verify
        env:
          CI: 'true'

      - name: Full build
        run: npm run build

      # The SQLite memory layer needs the Node better-sqlite3 runtime rather
      # than Bun's disabled fallback, so run these regressions after dist exists.
      - name: Node-only memory regressions
        run: npm run test:node

      - name: Package contents smoke test
        run: npm pack --dry-run
