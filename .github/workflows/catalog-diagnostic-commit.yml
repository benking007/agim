name: Persist catalog migration diagnostic

on:
  pull_request:
    branches: [refactor/web-hook-stability]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'refactor/agent-catalog-session' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Persist diagnostic
        shell: bash
        run: |
          set +e
          python3 scripts/agent-catalog-metadata.py > catalog-metadata-diagnostic.txt 2>&1
          status=$?
          echo "exit_status=$status" >> catalog-metadata-diagnostic.txt
          git restore src/core/registry.ts src/core/onboarding.ts \
            src/plugins/agents/antigravity/index.ts \
            src/plugins/agents/codex/index.ts \
            src/plugins/agents/opencode/adapter.test.ts \
            src/plugins/agents/opencode/opencode-http-adapter.ts \
            src/plugins/agents/cursor/index.ts \
            test/unit/agent-session-architecture.test.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog-metadata-diagnostic.txt
          git commit -m 'chore: record catalog migration diagnostic'
          git push origin HEAD:refactor/agent-catalog-session
