name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any prior run on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ───── Backend (agim-cli) ─────
      # --omit=optional dodges @xenova/transformers (ONNX binary) which
      # triggers npm's "Exit handler never called!" regression on Node
      # 22+. End users still get the dep on `npm install -g agim-cli`;
      # CI doesn't exercise the vector path. Same flag as release.yml.
      #
      # But biome ALSO uses optionalDependencies for its platform-
      # specific CLI (@biomejs/cli-linux-x64), and main `biome` requires
      # it to function — so we re-install biome explicitly after.
      # The second install still hits the npm "Exit handler" crash
      # (any re-resolution of @xenova/transformers triggers it), but
      # npm extracts the new tarball *before* the crash, so the
      # platform binary is on disk and biome works. `|| true` keeps
      # the workflow alive; the `test -f` guard catches the case
      # where extraction didn't happen.
      - name: Install root dependencies
        run: |
          npm install --omit=optional --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @biomejs/cli-linux-x64 || true
          test -f node_modules/@biomejs/cli-linux-x64/biome

      - name: Backend typecheck
        run: npm run typecheck

      - name: Backend lint
        run: npm run lint

      - name: Backend test
        run: npm test
        env:
          LOG_LEVEL: error

      # ───── Frontend (src/web-app) ─────
      # M1 web rewrite stack — see /root/.claude/plans/web-web-web-web-ui-bug-...md.
      # The web-app project lives in its own Vite workspace with its own
      # deps + tsconfig. CI runs it as a separate npm root so the backend
      # build pipeline stays decoupled from the SPA build pipeline.
      - name: Install web-app dependencies
        run: npm --prefix src/web-app install --no-audit --no-fund

      - name: Web-app typecheck
        run: npm --prefix src/web-app run typecheck

      # i18n parity gate — fails fast if any en/zh dictionary drifts
      # so a forgotten translation can't land alongside a feature.
      - name: Web-app i18n parity (en ⇄ zh)
        run: npm --prefix src/web-app run check-i18n

      - name: Web-app test (vitest)
        run: npm --prefix src/web-app test -- --run
        env:
          CI: 'true'

      - name: Web-app build
        run: npm --prefix src/web-app run build

      # ───── Backend full build (with web-app dist in place) ─────
      # Backend build copies frontend dist/* into dist/web/public/ in M5
      # (PR with the build-script wiring). Until then this is just the
      # backend's own `tsc + cp src/web/public`, kept on its own line so
      # the CI still validates it independently.
      - name: Backend build
        run: npm run build
