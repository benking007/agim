name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-hook-stability:
    if: github.head_ref == 'refactor/web-hook-stability'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Apply hook stability codemod
        id: codemod
        if: github.actor != 'github-actions[bot]'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 scripts/hook-stability-codemod.py > /tmp/hook-codemod.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            git diff --check >> /tmp/hook-codemod.log 2>&1
            status=$?
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat /tmp/hook-codemod.log
          exit 0

      - name: Report codemod failure
        if: github.actor != 'github-actions[bot]' && steps.codemod.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          {
            echo '<!-- agim-hook-stability-codemod -->'
            echo '### Hook stability codemod failed'
            echo
            echo '```text'
            tail -n 120 /tmp/hook-codemod.log
            echo '```'
          } > /tmp/hook-codemod-comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/hook-codemod-comment.md

      - name: Commit codemod result
        id: commit-result
        if: github.actor != 'github-actions[bot]' && steps.codemod.outputs.status == '0'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          (
            set -euxo pipefail
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/web-app/src/hooks/use-chat.ts \
              src/web-app/src/routes/memory/facts.tsx \
              src/web-app/src/routes/memos.tsx \
              src/web-app/src/routes/observability/audit.tsx \
              src/web-app/src/routes/settings/email.tsx \
              src/web-app/src/routes/settings/viewer.tsx \
              biome.json
            if ! git diff --cached --quiet; then
              git commit -m 'refactor(web): stabilize effect dependencies'
              git push --force-with-lease origin HEAD:refactor/web-hook-stability
            fi
          ) > /tmp/hook-commit.log 2>&1
          status=$?
          cat /tmp/hook-commit.log
          exit "$status"

      - name: Report codemod commit failure
        if: steps.commit-result.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          {
            echo '<!-- agim-hook-stability-commit -->'
            echo '### Hook stability commit failed'
            echo
            echo '```text'
            tail -n 120 /tmp/hook-commit.log
            echo '```'
          } > /tmp/hook-commit-comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/hook-commit-comment.md

      - name: Enforce codemod
        if: github.actor != 'github-actions[bot]' && (steps.codemod.outputs.status != '0' || steps.commit-result.outcome == 'failure')
        run: exit 1

      - name: Install web-app dependencies
        run: npm --prefix src/web-app ci --no-audit --no-fund --legacy-peer-deps --loglevel=error

      - name: Web-app typecheck
        run: npm --prefix src/web-app run typecheck

      - name: Web-app lint
        run: npm --prefix src/web-app run lint:ci

      - name: Web-app test
        run: npm --prefix src/web-app test -- --run
        env:
          CI: 'true'
