<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>im-hub-pro — Login</title>
  <script src="/_app.js"></script>
  <script>
    const savedLang = localStorage.getItem('im-hub-lang');
    const browserLang = navigator.language.startsWith('zh') ? 'zh' : 'en';
    window.__lang = savedLang || browserLang;
    document.documentElement.lang = window.__lang === 'zh' ? 'zh-CN' : 'en';
  </script>
  <style>
    :root {
      --bg: #f8f9fa; --fg: #1a1a2e; --card-bg: #fff;
      --border: #dee2e6; --accent: #0d6efd; --accent-hover: #0b5ed7;
      --input-bg: #fff; --input-border: #ced4da;
      --error-bg: #f8d7da; --error-fg: #842029;
    }
    :root[data-theme="dark"], @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
      --bg: #0d1117; --fg: #c9d1d9; --card-bg: #161b22;
      --border: #30363d; --accent: #58a6ff; --accent-hover: #79b8ff;
      --input-bg: #0d1117; --input-border: #30363d;
      --error-bg: #3d1418; --error-fg: #f8d7da;
    }}
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      background: var(--bg); color: var(--fg); display: flex; align-items: center;
      justify-content: center; min-height: 100vh; }
    .card { background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 2rem; max-width: 400px; width: 90%; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
    h1 { font-size: 1.25rem; margin-bottom: .5rem; }
    p { font-size: .875rem; color: var(--fg); opacity: .7; margin-bottom: 1.5rem; }
    label { display: block; font-size: .875rem; margin-bottom: .25rem; font-weight: 500; }
    input[type="password"] { width: 100%; padding: .5rem .75rem; border: 1px solid var(--input-border);
      border-radius: 6px; background: var(--input-bg); color: var(--fg); font-size: .875rem;
      margin-bottom: 1rem; }
    button { width: 100%; padding: .5rem 1rem; background: var(--accent); color: #fff;
      border: none; border-radius: 6px; font-size: .875rem; cursor: pointer; font-weight: 500; }
    button:hover { background: var(--accent-hover); }
    .error { display: none; background: var(--error-bg); color: var(--error-fg);
      padding: .5rem .75rem; border-radius: 6px; font-size: .8rem; margin-bottom: 1rem; }
    .hint { font-size: .75rem; opacity: .5; margin-top: 1rem; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h1 data-i18n="loginTitle">im-hub-pro</h1>
    <p data-i18n="loginDesc">Enter the web console token to continue.</p>
    <div class="error" id="error"></div>
    <form id="form">
      <label for="token" data-i18n="tokenLabel">Token</label>
      <input type="password" id="token" autocomplete="off" autofocus>
      <button type="submit" data-i18n="loginBtn">Log in</button>
    </form>
    <div class="hint" data-i18n="tokenHint">Find your token in ~/.im-hub/web-token</div>
  </div>
  <script>
    const T = {
      en: { loginTitle:'im-hub-pro', loginDesc:'Enter the web console token to continue.',
            tokenLabel:'Token', loginBtn:'Log in', tokenHint:'Find your token in ~/.im-hub/web-token',
            badToken:'Invalid token', networkErr:'Network error — is the server running?' },
      zh: { loginTitle:'im-hub-pro', loginDesc:'请输入控制台 token 以继续。',
            tokenLabel:'Token', loginBtn:'登录', tokenHint:'Token 位于 ~/.im-hub/web-token',
            badToken:'Token 无效', networkErr:'网络错误 — 服务是否正在运行？' },
    };
    const L = T[window.__lang] || T.en;
    window.imhub.i18n.apply(L);

    const form = document.getElementById('form');
    const errEl = document.getElementById('error');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.style.display = 'none';
      const token = document.getElementById('token').value.trim();
      if (!token) return;
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token }),
        });
        if (res.ok) {
          const dest = new URLSearchParams(location.search).get('next') || '/';
          location.href = dest;
        } else {
          errEl.textContent = L.badToken;
          errEl.style.display = 'block';
        }
      } catch {
        errEl.textContent = L.networkErr;
        errEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
