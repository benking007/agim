name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-hook-stability:
    if: github.head_ref == 'refactor/web-hook-stability'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Apply remaining hook fixes
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          python3 scripts/hook-stability-codemod.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/web-app/src/routes/chat.tsx \
            src/web-app/src/routes/m/chat.tsx \
            src/web-app/src/routes/memory/facts.tsx \
            src/web-app/src/routes/workspace.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'refactor(web): make effect triggers explicit'
            git push origin HEAD:refactor/web-hook-stability
          fi

      - name: Install web-app dependencies
        run: npm --prefix src/web-app ci --no-audit --no-fund --legacy-peer-deps --loglevel=error

      - name: Web-app typecheck
        run: npm --prefix src/web-app run typecheck

      - name: Web-app lint
        run: npm --prefix src/web-app run lint:ci

      - name: Web-app test
        run: npm --prefix src/web-app test -- --run
        env:
          CI: 'true'
