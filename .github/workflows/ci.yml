name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install root dependencies
        shell: bash
        run: |
          npm ci --omit=optional --no-audit --no-fund --legacy-peer-deps --loglevel=error
          BIOME_VERSION=$(node -p "require('./node_modules/@biomejs/biome/package.json').version")
          npm install --no-save --no-package-lock --no-audit --no-fund --legacy-peer-deps --loglevel=error "@biomejs/cli-linux-x64@$BIOME_VERSION"
          test -f node_modules/@biomejs/cli-linux-x64/biome

      - name: Install web-app dependencies
        run: npm --prefix src/web-app ci --no-audit --no-fund --legacy-peer-deps --loglevel=error

      - name: Backend typecheck
        run: npm run typecheck

      - name: Backend lint
        run: npm run lint:ci

      - name: Backend test groups
        shell: bash
        env:
          LOG_LEVEL: error
        run: |
          set +e
          failed=0
          for group in test src/core src/plugins src/scripts src/utils; do
            log="/tmp/$(echo "$group" | tr '/' '-').log"
            bun test "$group" --path-ignore-patterns='**/web-app/**' > "$log" 2>&1
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "=== FAILED GROUP: $group ==="
              tail -n 120 "$log"
              failed=1
            else
              echo "PASS $group"
            fi
          done
          exit "$failed"

      - name: Web-app typecheck
        run: npm --prefix src/web-app run typecheck

      - name: Web-app lint
        run: npm --prefix src/web-app run lint:ci

      - name: Web-app i18n parity
        run: npm --prefix src/web-app run check-i18n

      - name: Web-app endpoint manifest
        run: npm --prefix src/web-app run check-endpoints

      - name: Web-app test
        run: npm --prefix src/web-app test -- --run
        env:
          CI: 'true'

      - name: Full build
        run: npm run build

      - name: Node-only memory regressions
        run: npm run test:node

      - name: Package contents smoke test
        run: npm pack --dry-run
