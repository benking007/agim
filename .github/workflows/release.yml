name: Publish to npm

# This file is the npm Trusted Publisher workflow. The filename must
# stay `release.yml` — npm OIDC checks the *root* workflow name, not a
# nested reusable job. Do not invoke this file via workflow_call from
# another workflow (that made npm see `auto-version.yml` and return
# ENEEDAUTH).
on:
  pull_request:
    types: [closed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'package.json'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  bump:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Determine bump level
        id: bump
        run: |
          LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'
          if echo "$LABELS" | grep -q '"major"'; then
            echo "level=major" >> $GITHUB_OUTPUT
          elif echo "$LABELS" | grep -q '"minor"'; then
            echo "level=minor" >> $GITHUB_OUTPUT
          else
            echo "level=patch" >> $GITHUB_OUTPUT
          fi

      - name: Bump version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version ${{ steps.bump.outputs.level }} -m "chore: release v%s"
          git push

      - name: Record bump metadata
        id: meta
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

  publish:
    needs: bump
    if: always() && !cancelled() && (needs.bump.result == 'success' || needs.bump.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ needs.bump.outputs.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          # No registry-url: that writes `_authToken=${NODE_AUTH_TOKEN}`
          # and blocks the OIDC exchange (ENEEDAUTH / EOTP).

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check publish needed
        id: version
        run: |
          CURR_VERSION=$(jq -r '.version' package.json)
          PUBLISHED_VERSION=$(npm view agim-cli version 2>/dev/null || echo "none")
          if [ "$PUBLISHED_VERSION" != "$CURR_VERSION" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "version=$CURR_VERSION" >> $GITHUB_OUTPUT
            echo "published=$PUBLISHED_VERSION" >> $GITHUB_OUTPUT
          else
            echo "npm already has v$CURR_VERSION."
          fi

      - name: Install dependencies
        if: steps.version.outputs.changed == 'true'
        run: |
          npm --version
          npm ci --omit=optional --no-audit --no-fund --legacy-peer-deps
          BIOME_VERSION="$(node -p "require('./node_modules/@biomejs/biome/package.json').version")"
          BIOME_DIR="$RUNNER_TEMP/agim-biome"
          npm install --prefix "$BIOME_DIR" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org "@biomejs/cli-linux-x64@$BIOME_VERSION"
          test -f "$BIOME_DIR/node_modules/@biomejs/cli-linux-x64/biome"
          echo "BIOME_BINARY=$BIOME_DIR/node_modules/@biomejs/cli-linux-x64/biome" >> "$GITHUB_ENV"

      - name: Install web-app dependencies
        if: steps.version.outputs.changed == 'true'
        working-directory: src/web-app
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Backend typecheck
        if: steps.version.outputs.changed == 'true'
        run: npm run typecheck

      - name: Repository lint
        if: steps.version.outputs.changed == 'true'
        run: npm run lint

      - name: Backend tests
        if: steps.version.outputs.changed == 'true'
        run: npm test
        env:
          LOG_LEVEL: error

      - name: Web-app typecheck
        if: steps.version.outputs.changed == 'true'
        run: npm --prefix src/web-app run typecheck

      - name: Web-app i18n parity
        if: steps.version.outputs.changed == 'true'
        run: npm --prefix src/web-app run check-i18n

      - name: Web-app endpoint contracts
        if: steps.version.outputs.changed == 'true'
        run: npm run check:contracts

      - name: Web-app tests
        if: steps.version.outputs.changed == 'true'
        run: npm --prefix src/web-app test -- --run
        env:
          CI: 'true'

      - name: Build
        if: steps.version.outputs.changed == 'true'
        run: npm run build

      - name: SQLite persistence regressions
        if: steps.version.outputs.changed == 'true'
        run: npm run test:node

      - name: Use npm 11.5.1 for OIDC publish
        if: steps.version.outputs.changed == 'true'
        # Trusted Publishing requires npm >= 11.5.1. Pin the version —
        # `npm@latest` previously shipped a tarball missing `sigstore`.
        run: |
          npm install -g npm@11.5.1
          npm --version

      - name: Publish to npm
        if: steps.version.outputs.changed == 'true'
        # OIDC Trusted Publishing. No NODE_AUTH_TOKEN.
        # Provenance off: this repository is private (npm would 422).
        run: npm publish --access public
        env:
          NPM_CONFIG_PROVENANCE: 'false'

      - name: Summary
        if: steps.version.outputs.changed == 'true'
        run: |
          echo "✅ Published v${{ steps.version.outputs.version }} to npm" >> $GITHUB_STEP_SUMMARY
