name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-hook-stability:
    if: github.head_ref == 'refactor/web-hook-stability'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install web-app dependencies
        run: npm --prefix src/web-app ci --no-audit --no-fund --legacy-peer-deps --loglevel=error

      - name: Web-app typecheck
        run: npm --prefix src/web-app run typecheck

      - name: Web-app lint
        id: web-lint
        continue-on-error: true
        shell: bash
        run: npm --prefix src/web-app run lint:ci > /tmp/web-hook-lint.log 2>&1

      - name: Report hook lint diagnostics
        if: steps.web-lint.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          sed -E 's/\x1B\[[0-9;]*[mK]//g' /tmp/web-hook-lint.log > /tmp/web-hook-lint-clean.log
          {
            echo '<!-- agim-hook-stability-lint -->'
            echo '### Remaining hook dependency diagnostics'
            echo
            echo '```text'
            grep -E '^(src|tools|vite\.config\.ts).* lint/correctness/useExhaustiveDependencies' /tmp/web-hook-lint-clean.log || true
            echo '```'
          } > /tmp/web-hook-lint-comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/web-hook-lint-comment.md

      - name: Enforce Web lint
        if: steps.web-lint.outcome == 'failure'
        run: exit 1

      - name: Web-app test
        run: npm --prefix src/web-app test -- --run
        env:
          CI: 'true'
