name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
  # Manual trigger — needed when an auto-version-bump commit lands on main.
  # GitHub Actions deliberately blocks bot commits (incl. github-actions[bot]
  # from the auto-version workflow) from triggering other workflows, so an
  # auto-bumped package.json never fires this push hook. Maintainers run
  # workflow_dispatch from the Actions UI (or the REST API) to publish.
  workflow_dispatch:

permissions:
  id-token: write # 必须：用于 OIDC 身份验证
  contents: read  # 必须：用于检出代码

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          # 双通道：
          # - 优先 OIDC trusted publishing（npmjs.com 上为 im-hub-pro 配置好后自动启用）
          # - 兜底 NPM_TOKEN（automation token，配 id-token:write 同样可带 provenance）
          # registry-url 让 setup-node 把 NODE_AUTH_TOKEN 注入到 ~/.npmrc
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check publish needed
        id: version
        run: |
          CURR_VERSION=$(jq -r '.version' package.json)
          PUBLISHED_VERSION=$(npm view agim-cli version 2>/dev/null || echo "none")
          if [ "$PUBLISHED_VERSION" != "$CURR_VERSION" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "version=$CURR_VERSION" >> $GITHUB_OUTPUT
            echo "published=$PUBLISHED_VERSION" >> $GITHUB_OUTPUT
          else
            echo "npm already has v$CURR_VERSION."
          fi

      # npm 10 and npm 11 both crash with "Exit handler never called!"
      # when installing better-sqlite3 / prebuild-install on the GitHub
      # ubuntu-latest runner. We already install Bun for the test step,
      # so use `bun install` here too — much faster and skips the crash.
      # https://github.com/npm/cli/issues/8284
      - name: Install dependencies
        if: steps.version.outputs.changed == 'true'
        run: bun install --frozen-lockfile || bun install

      - name: Build
        if: steps.version.outputs.changed == 'true'
        run: npm run build

      - name: Run tests
        if: steps.version.outputs.changed == 'true'
        run: npm test

      - name: Publish to npm
        if: steps.version.outputs.changed == 'true'
        # NOTE: `--provenance` is intentionally omitted. npm requires the
        # source repo to be public for sigstore provenance verification —
        # benking007/imhub is private (422 Unprocessable Entity). Re-add
        # `--provenance` once the repo is flipped to public; until then
        # we publish with the OIDC / NPM_TOKEN auth path but no sigstore
        # attestation. (Older 0.2.x / 0.3.x releases shipped the same way.)
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        if: steps.version.outputs.changed == 'true'
        run: |
          echo "✅ Published v${{ steps.version.outputs.version }} to npm" >> $GITHUB_STEP_SUMMARY