name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install root dependencies
        shell: bash
        run: |
          npm ci --omit=optional --no-audit --no-fund --legacy-peer-deps --loglevel=error
          BIOME_VERSION=$(node -p "require('./node_modules/@biomejs/biome/package.json').version")
          npm install --no-save --no-package-lock --no-audit --no-fund --legacy-peer-deps --loglevel=error "@biomejs/cli-linux-x64@$BIOME_VERSION"
          test -f node_modules/@biomejs/cli-linux-x64/biome

      - name: Install web-app dependencies
        run: npm --prefix src/web-app ci --no-audit --no-fund --legacy-peer-deps --loglevel=error

      - name: Backend typecheck
        run: npm run typecheck

      - name: Backend lint
        run: npm run lint:ci

      - name: Backend test
        run: npm test
        env:
          LOG_LEVEL: error

      - name: Web-app typecheck
        run: npm --prefix src/web-app run typecheck

      - name: Web-app lint
        run: npm --prefix src/web-app run lint:ci

      - name: Web-app i18n parity
        run: npm --prefix src/web-app run check-i18n

      - name: Web-app endpoint manifest
        run: npm --prefix src/web-app run check-endpoints

      - name: Web-app test
        id: web-test
        continue-on-error: true
        shell: bash
        run: npm --prefix src/web-app test -- --run --reporter=verbose > /tmp/web-test.log 2>&1
        env:
          CI: 'true'

      - name: Report web-app test diagnostics
        if: steps.web-test.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          sed -E 's/\x1B\[[0-9;]*[mK]//g' /tmp/web-test.log > /tmp/web-test-clean.log
          {
            echo '<!-- agim-ci-web-test -->'
            echo '### Web-app test root cause'
            echo
            echo '```text'
            grep -nE 'Error:|ReferenceError:|TypeError:|SyntaxError:|Failed to|Cannot find|Caused by|Test Files|Tests ' /tmp/web-test-clean.log | tail -n 100
            echo
            echo '--- final log lines ---'
            tail -n 50 /tmp/web-test-clean.log
            echo '```'
          } > /tmp/web-test-comment.md
          gh api --method PATCH "repos/$REPOSITORY/issues/comments/4932093006" \
            --raw-field "body=$(cat /tmp/web-test-comment.md)"

      - name: Enforce web-app tests
        if: steps.web-test.outcome == 'failure'
        run: exit 1

      - name: Full build
        run: npm run build

      # The SQLite memory layer needs the Node better-sqlite3 runtime rather
      # than Bun's disabled fallback, so run these regressions after dist exists.
      - name: Node-only memory regressions
        run: npm run test:node

      - name: Package contents smoke test
        run: npm pack --dry-run
