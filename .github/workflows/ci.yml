name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install root dependencies
        shell: bash
        run: |
          npm ci --omit=optional --no-audit --no-fund --legacy-peer-deps --loglevel=error
          BIOME_VERSION=$(node -p "require('./node_modules/@biomejs/biome/package.json').version")
          npm install --no-save --no-package-lock --no-audit --no-fund --legacy-peer-deps --loglevel=error "@biomejs/cli-linux-x64@$BIOME_VERSION"
          test -f node_modules/@biomejs/cli-linux-x64/biome

      - name: Install web-app dependencies
        run: npm --prefix src/web-app ci --no-audit --no-fund --legacy-peer-deps --loglevel=error

      - name: Apply one-time Web lint fixes
        id: web-autofix
        continue-on-error: true
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/agim-development' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set +e
          (
            set -euxo pipefail
            npm --prefix src/web-app exec -- biome lint src tools vite.config.ts --write --unsafe || true
            git status --short
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -u src/web-app
            if ! git diff --cached --quiet; then
              git diff --cached --check
              git commit -m 'style(web): apply biome lint fixes'
              git push origin HEAD:codex/agim-development
            fi
          ) > /tmp/web-autofix.log 2>&1
          status=$?
          cat /tmp/web-autofix.log
          exit "$status"

      - name: Report Web autofix failure
        if: steps.web-autofix.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          {
            echo '<!-- agim-ci-web-autofix -->'
            echo '### One-time Web autofix failed'
            echo
            echo '```text'
            tail -n 120 /tmp/web-autofix.log
            echo '```'
          } > /tmp/web-autofix-comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/web-autofix-comment.md

      - name: Web-app typecheck
        run: npm --prefix src/web-app run typecheck

      - name: Web-app lint
        id: web-lint
        continue-on-error: true
        shell: bash
        run: npm --prefix src/web-app run lint:ci > /tmp/web-lint.log 2>&1

      - name: Report web-app lint diagnostics
        if: steps.web-lint.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          grep -E '^(src|tools|vite\.config\.ts).* lint/' /tmp/web-lint.log > /tmp/web-lint-compact.log || true
          {
            echo '<!-- agim-ci-web-lint-compact -->'
            echo '### Web-app blocking lint diagnostics'
            echo
            echo '```text'
            cat /tmp/web-lint-compact.log
            echo '```'
          } > /tmp/web-lint-comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/web-lint-comment.md

      - name: Enforce web-app lint
        if: steps.web-lint.outcome == 'failure'
        run: exit 1

      - name: Backend typecheck
        run: npm run typecheck

      - name: Backend lint
        run: npm run lint:ci

      - name: Backend test
        run: npm test
        env:
          LOG_LEVEL: error

      - name: Web-app i18n parity
        run: npm --prefix src/web-app run check-i18n

      - name: Web-app endpoint contract
        run: npm --prefix src/web-app run check-endpoints

      - name: Web-app test
        run: npm --prefix src/web-app test -- --run
        env:
          CI: 'true'

      - name: Full build
        run: npm run build

      # The SQLite memory layer needs the Node better-sqlite3 runtime rather
      # than Bun's disabled fallback, so run these regressions after dist exists.
      - name: Node-only memory regressions
        run: npm run test:node

      - name: Package contents smoke test
        run: npm pack --dry-run
