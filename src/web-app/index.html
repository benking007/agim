<!DOCTYPE html>
  <html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover so iOS safe-area-inset-* actually has values.
       interactive-widget=resizes-content (Safari 17+) shrinks the layout
       viewport with the soft keyboard; we still lift via visualViewport.
       Chat inputs use text-md (16px; theme text-base is 15px) so we do not
       need maximum-scale=1 (which blocks pinch-zoom accessibility). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0e0f12" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="Agim — multi-agent gateway console" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Agim" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>Agim</title>
  <!--
    Synchronous theme bootstrap. Reads localStorage 'agim-theme' BEFORE
    the React bundle parses + renders, so the first paint already has
    the right `data-theme` attribute on <html>. Without this, the page
    flashes light-themed for ~80ms on dark-mode setups (the JS render
    happens after first paint).

    Mirrors the same key + state machine that agim-cli's old _app.js
    used — keeps user preference continuous across the v1 → v2
    upgrade.
  -->
  <script>
    (() => {
      try {
        const m = localStorage.getItem('agim-theme')
        if (m === 'light' || m === 'dark') {
          document.documentElement.setAttribute('data-theme', m)
        }
      } catch { /* private-mode storage exceptions: noop */ }
    })()
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
