name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Repair legacy session terminology
        if: github.event_name == 'pull_request' && github.head_ref == 'refactor/agent-catalog-session' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/core/session.ts')
          text = path.read_text()
          old = """   *   - claudeSessionId   (Claude UUID survives /oc → /cc round-trips so the
   *                        underlying ~/.claude/projects jsonl keeps continuing
   *                        when the user comes back to claude)
"""
          new = """   *   - agentSessions     (adapter-native resume state survives switches so
   *                        returning to a backend continues its conversation)
"""
          if old not in text:
              raise SystemExit('legacy session comment not found exactly once')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/session.ts
          if ! git diff --cached --quiet; then
            git commit -m 'docs(core): remove legacy session field terminology'
            git push origin HEAD:refactor/agent-catalog-session
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install root dependencies
        shell: bash
        run: |
          npm ci --omit=optional --no-audit --no-fund --legacy-peer-deps --loglevel=error
          BIOME_VERSION=$(node -p "require('./node_modules/@biomejs/biome/package.json').version")
          npm install --no-save --no-package-lock --no-audit --no-fund --legacy-peer-deps --loglevel=error "@biomejs/cli-linux-x64@$BIOME_VERSION"
          test -f node_modules/@biomejs/cli-linux-x64/biome

      - name: Install web-app dependencies
        run: npm --prefix src/web-app ci --no-audit --no-fund --legacy-peer-deps --loglevel=error

      - name: Backend typecheck
        run: npm run typecheck

      - name: Backend lint
        run: npm run lint:ci

      - name: Backend test
        id: backend-test
        continue-on-error: true
        shell: bash
        run: npm test > /tmp/backend-test.log 2>&1
        env:
          LOG_LEVEL: error

      - name: Persist backend test diagnostics
        if: steps.backend-test.outcome == 'failure' && github.event_name == 'pull_request' && github.head_ref == 'refactor/agent-catalog-session'
        shell: bash
        run: |
          cp /tmp/backend-test.log backend-test-diagnostic.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f backend-test-diagnostic.txt
          git commit -m 'chore: record agent catalog test failure'
          git push origin HEAD:refactor/agent-catalog-session

      - name: Enforce backend tests
        if: steps.backend-test.outcome == 'failure'
        run: exit 1

      - name: Web-app typecheck
        run: npm --prefix src/web-app run typecheck

      - name: Web-app lint
        run: npm --prefix src/web-app run lint:ci

      - name: Web-app i18n parity
        run: npm --prefix src/web-app run check-i18n

      - name: Web-app endpoint manifest
        run: npm --prefix src/web-app run check-endpoints

      - name: Web-app test
        run: npm --prefix src/web-app test -- --run
        env:
          CI: 'true'

      - name: Full build
        run: npm run build

      - name: Node-only memory regressions
        run: npm run test:node

      - name: Package contents smoke test
        run: npm pack --dry-run
