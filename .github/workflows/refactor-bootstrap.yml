name: One-time refactor bootstrap

on:
  push:
    branches: [codex/agim-development]

permissions:
  contents: write

concurrency:
  group: refactor-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: codex/agim-development
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Fix blocking lint regression and normalize root lockfile
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          test_path = Path('src/plugins/agents/opencode/http-adapter.test.ts')
          text = test_path.read_text()
          old = "    expect((messageHit?.body as Record<string, unknown>).agent).toBe('plan')"
          new = "    if (!messageHit) throw new Error('expected plan-mode message POST')\n    expect((messageHit.body as Record<string, unknown>).agent).toBe('plan')"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one lint target, found {text.count(old)}')
          test_path.write_text(text.replace(old, new))

          lock_path = Path('package-lock.json')
          lock = lock_path.read_text()
          old_registry = 'http://mirrors.tencentyun.com/npm/'
          count = lock.count(old_registry)
          if count == 0:
              raise SystemExit('root lockfile has no internal mirror URLs to normalize')
          lock_path.write_text(lock.replace(old_registry, 'https://registry.npmjs.org/'))
          print(f'normalized {count} root lockfile URLs')
          PY

      - name: Generate web-app lockfile from the public registry
        run: npm --prefix src/web-app install --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps --registry=https://registry.npmjs.org

      - name: Validate generated files
        shell: bash
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('package-lock.json', 'utf8')); JSON.parse(require('node:fs').readFileSync('src/web-app/package-lock.json', 'utf8'))"
          if grep -R "mirrors.tencentyun.com" package-lock.json src/web-app/package-lock.json; then
            echo 'internal mirror URL remains in a lockfile' >&2
            exit 1
          fi
          git diff --check

      - name: Commit generated changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json src/web-app/package-lock.json src/plugins/agents/opencode/http-adapter.test.ts
          git commit -m 'build: normalize lockfiles and fix lint regression'
          git push origin HEAD:codex/agim-development
