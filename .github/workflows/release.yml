name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
  # Bot-authored version bumps do not trigger another workflow, so maintainers
  # can explicitly dispatch the publish after reviewing the version commit.
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Check publish needed
        id: version
        run: |
          CURR_VERSION=$(jq -r '.version' package.json)
          PUBLISHED_VERSION=$(npm view agim-cli version 2>/dev/null || echo "none")
          if [ "$PUBLISHED_VERSION" != "$CURR_VERSION" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$CURR_VERSION" >> "$GITHUB_OUTPUT"
            echo "published=$PUBLISHED_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "npm already has v$CURR_VERSION."
          fi

      # Keep the temporary public-registry install workaround aligned with CI.
      # The next dependency-hardening step will regenerate both lockfiles and
      # switch these commands to npm ci.
      - name: Install root dependencies
        if: steps.version.outputs.changed == 'true'
        run: |
          npm install --omit=optional --no-package-lock --no-audit --no-fund --legacy-peer-deps
          npm install --no-save --no-package-lock --no-audit --no-fund --legacy-peer-deps @biomejs/cli-linux-x64 || true
          test -f node_modules/@biomejs/cli-linux-x64/biome

      - name: Install web-app dependencies
        if: steps.version.outputs.changed == 'true'
        run: npm --prefix src/web-app install --no-package-lock --no-audit --no-fund --legacy-peer-deps

      - name: Verify release candidate
        if: steps.version.outputs.changed == 'true'
        run: npm run verify
        env:
          CI: 'true'
          LOG_LEVEL: error

      - name: Package contents smoke test
        if: steps.version.outputs.changed == 'true'
        run: npm pack --dry-run

      - name: Publish to npm
        if: steps.version.outputs.changed == 'true'
        # Verification already ran explicitly above. --ignore-scripts avoids
        # executing prepublishOnly a second time while preserving the local
        # safeguard for maintainers who run npm publish themselves.
        run: npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'false'

      - name: Summary
        if: steps.version.outputs.changed == 'true'
        run: |
          echo "✅ Published v${{ steps.version.outputs.version }} to npm" >> "$GITHUB_STEP_SUMMARY"
