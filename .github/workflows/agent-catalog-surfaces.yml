name: Agent catalog surfaces migration

on:
  pull_request:
    branches: [refactor/agent-catalog-session]

permissions:
  contents: write

concurrency:
  group: agent-catalog-surfaces-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate-and-verify:
    if: github.head_ref == 'refactor/agent-catalog-surfaces'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: refactor/agent-catalog-surfaces
          fetch-depth: 0

      - name: Apply catalog surface migration
        shell: bash
        run: |
          python3 scripts/agent-catalog-surfaces.py
          node src/web-app/tools/extract-endpoints.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/cli-ui/config-wizard.ts src/web/server.ts \
            src/web-app/src/routes/settings/agents.tsx \
            src/web-app/src/routes/settings/agents.test.tsx \
            src/web-app/tools/endpoints.json
          if ! git diff --cached --quiet; then
            git commit -m 'refactor(surfaces): consume agent catalog metadata'
            git push origin HEAD:refactor/agent-catalog-surfaces
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        shell: bash
        run: |
          npm ci --omit=optional --no-audit --no-fund --legacy-peer-deps --loglevel=error
          BIOME_VERSION=$(node -p "require('./node_modules/@biomejs/biome/package.json').version")
          npm install --no-save --no-package-lock --no-audit --no-fund --legacy-peer-deps --loglevel=error "@biomejs/cli-linux-x64@$BIOME_VERSION"
          npm --prefix src/web-app ci --no-audit --no-fund --legacy-peer-deps --loglevel=error

      - name: Backend typecheck and lint
        run: |
          npm run typecheck
          npm run lint:ci

      - name: Catalog and CLI tests
        run: bun test test/unit/agent-session-architecture.test.ts src/cli-ui/config-wizard.test.ts src/core/onboarding.test.ts
        env:
          LOG_LEVEL: error

      - name: Web typecheck and lint
        run: |
          npm --prefix src/web-app run typecheck
          npm --prefix src/web-app run lint:ci
          npm --prefix src/web-app run check-endpoints

      - name: Agent settings tests
        run: npm --prefix src/web-app test -- --run src/routes/settings/agents.test.tsx
        env:
          CI: 'true'
