<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#042f2e" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Agim</title>
<style>
  :root {
    color-scheme: light dark;
    --ink: #134e4a;
    --muted: #5b7c78;
    --ok: #0f766e;
    --danger: #b91c1c;
    --pet-body: #14b8a6;
    --pet-hi: #5eead4;
    --pet-eye: #134e4a;
    --pet-mouth: #fb7185;
    --pet-chin: #0f766e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #ecfdf5;
      --muted: #99f6e4;
      --ok: #5eead4;
      --danger: #fca5a5;
      --pet-body: #2dd4bf;
      --pet-hi: #5eead4;
      --pet-eye: #0f172a;
      --pet-mouth: #f472b6;
      --pet-chin: #0d9488;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    min-height: 100dvh;
    font-family: "Agim CJK", -apple-system, BlinkMacSystemFont, "PingFang SC",
      "Hiragino Sans GB", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif,
      "Apple Color Emoji", "Segoe UI Emoji";
    color: var(--ink);
    background:
      radial-gradient(120% 80% at 50% 0%, rgba(45, 212, 191, 0.35), transparent 55%),
      radial-gradient(90% 60% at 80% 100%, rgba(20, 184, 166, 0.22), transparent 50%),
      linear-gradient(165deg, #f0fdfa 0%, #e2e8f0 48%, #ccfbf1 100%);
  }
  @media (prefers-color-scheme: dark) {
    body {
      background:
        radial-gradient(120% 80% at 50% 0%, rgba(45, 212, 191, 0.22), transparent 55%),
        radial-gradient(90% 60% at 20% 100%, rgba(15, 118, 110, 0.35), transparent 50%),
        linear-gradient(165deg, #042f2e 0%, #0b1220 50%, #134e4a 100%);
    }
  }

  .splash {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding:
      max(2.5rem, env(safe-area-inset-top))
      1.5rem
      max(2rem, env(safe-area-inset-bottom));
    text-align: center;
  }

  .stage {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.25rem;
    animation: splash-in 0.55s ease-out both;
  }

  .pet-wrap {
    position: relative;
    width: 7.5rem;
    height: 7.5rem;
    display: grid;
    place-items: center;
    animation: pet-bob 2.6s ease-in-out infinite;
  }
  .pet-wrap::before {
    content: "";
    position: absolute;
    inset: 8% 10%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(20, 184, 166, 0.28), transparent 70%);
    filter: blur(6px);
    z-index: 0;
  }
  .pet {
    position: relative;
    z-index: 1;
    width: 5.5rem;
    height: 5.5rem;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    filter: drop-shadow(0 10px 18px rgba(15, 118, 110, 0.28));
  }

  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.35rem;
  }
  .brand-mark {
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
  }
  .brand-badge {
    width: 2rem;
    height: 2rem;
    border-radius: 0.55rem;
    background: linear-gradient(145deg, #14b8a6, #0f766e);
    color: #fff;
    font: 700 1.05rem/2rem ui-monospace, SFMono-Regular, Menlo, monospace;
    box-shadow: 0 6px 16px rgba(15, 118, 110, 0.28);
  }
  .brand-word {
    margin: 0;
    font-size: clamp(1.85rem, 7vw, 2.35rem);
    font-weight: 800;
    letter-spacing: 0.14em;
    text-indent: 0.14em;
    line-height: 1;
  }
  .brand-tag {
    margin: 0;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.28em;
    text-indent: 0.28em;
    text-transform: uppercase;
    color: var(--muted);
    opacity: 0.9;
  }

  .status {
    min-height: 2.75rem;
    margin-top: 0.35rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 0.55rem;
  }
  .dots {
    display: inline-flex;
    gap: 0.35rem;
    height: 0.5rem;
    align-items: center;
  }
  .dots i {
    width: 0.38rem;
    height: 0.38rem;
    border-radius: 50%;
    background: var(--pet-body);
    opacity: 0.35;
    animation: dot-pulse 1.1s ease-in-out infinite;
  }
  .dots i:nth-child(2) { animation-delay: 0.15s; }
  .dots i:nth-child(3) { animation-delay: 0.3s; }
  .status[data-phase="ok"] .dots,
  .status[data-phase="err"] .dots { display: none; }

  .msg {
    margin: 0;
    max-width: 16rem;
    font-size: 0.8rem;
    line-height: 1.45;
    color: var(--muted);
  }
  .status[data-phase="ok"] .msg { color: var(--ok); font-weight: 600; }
  .status[data-phase="err"] .msg { color: var(--danger); }

  .retry {
    display: none;
    margin-top: 0.15rem;
    padding: 0.55rem 1.1rem;
    border-radius: 999px;
    background: #0f766e;
    color: #fff;
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
    box-shadow: 0 6px 16px rgba(15, 118, 110, 0.28);
  }
  .status[data-phase="err"] .retry { display: inline-flex; }

  .foot {
    position: absolute;
    left: 0; right: 0;
    bottom: max(1.1rem, env(safe-area-inset-bottom));
    padding: 0 1.5rem;
    font-size: 0.68rem;
    line-height: 1.45;
    color: var(--muted);
    opacity: 0.75;
    text-align: center;
  }
  .status[data-phase="ok"] ~ .foot { opacity: 0; }

  @keyframes splash-in {
    from { opacity: 0; transform: translateY(10px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes pet-bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  @keyframes dot-pulse {
    0%, 100% { opacity: 0.28; transform: translateY(0); }
    50% { opacity: 1; transform: translateY(-2px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .pet-wrap, .dots i, .stage { animation: none !important; }
  }
</style>
</head>
<body>
  <main class="splash" role="main" aria-busy="true" aria-live="polite">
    <div class="stage">
      <div class="pet-wrap" aria-hidden="true">
        <!-- Same idle pixel pet as Portal (16×16). -->
        <svg class="pet" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="15" width="8" height="1" fill="#000" opacity="0.18"/>
          <!-- body o -->
          <rect x="6" y="1" width="4" height="1" fill="var(--pet-body)"/>
          <rect x="5" y="2" width="6" height="1" fill="var(--pet-body)"/>
          <rect x="4" y="3" width="8" height="1" fill="var(--pet-body)"/>
          <rect x="3" y="4" width="2" height="1" fill="var(--pet-body)"/><rect x="5" y="4" width="1" height="1" fill="var(--pet-hi)"/><rect x="6" y="4" width="4" height="1" fill="var(--pet-body)"/><rect x="10" y="4" width="1" height="1" fill="var(--pet-hi)"/><rect x="11" y="4" width="2" height="1" fill="var(--pet-body)"/>
          <rect x="3" y="5" width="10" height="1" fill="var(--pet-body)"/>
          <rect x="2" y="6" width="12" height="1" fill="var(--pet-body)"/>
          <rect x="2" y="7" width="2" height="1" fill="var(--pet-body)"/><rect x="4" y="7" width="2" height="1" fill="var(--pet-eye)"/><rect x="6" y="7" width="4" height="1" fill="var(--pet-body)"/><rect x="10" y="7" width="2" height="1" fill="var(--pet-eye)"/><rect x="12" y="7" width="2" height="1" fill="var(--pet-body)"/>
          <rect x="2" y="8" width="2" height="1" fill="var(--pet-body)"/><rect x="4" y="8" width="2" height="1" fill="var(--pet-eye)"/><rect x="6" y="8" width="4" height="1" fill="var(--pet-body)"/><rect x="10" y="8" width="2" height="1" fill="var(--pet-eye)"/><rect x="12" y="8" width="2" height="1" fill="var(--pet-body)"/>
          <rect x="2" y="9" width="12" height="1" fill="var(--pet-body)"/>
          <rect x="3" y="10" width="10" height="1" fill="var(--pet-body)"/>
          <rect x="3" y="11" width="4" height="1" fill="var(--pet-body)"/><rect x="7" y="11" width="2" height="1" fill="var(--pet-mouth)"/><rect x="9" y="11" width="4" height="1" fill="var(--pet-body)"/>
          <rect x="3" y="12" width="10" height="1" fill="var(--pet-body)"/>
          <rect x="4" y="13" width="5" height="1" fill="var(--pet-body)"/><rect x="9" y="13" width="1" height="1" fill="var(--pet-chin)"/><rect x="10" y="13" width="2" height="1" fill="var(--pet-body)"/>
          <rect x="5" y="14" width="6" height="1" fill="var(--pet-body)"/>
          <rect x="6" y="15" width="1" height="1" fill="var(--pet-body)"/><rect x="9" y="15" width="1" height="1" fill="var(--pet-body)"/>
        </svg>
      </div>

      <div class="brand">
        <div class="brand-mark">
          <span class="brand-badge" aria-hidden="true">a</span>
          <h1 class="brand-word">AGIM</h1>
        </div>
        <p class="brand-tag" id="tag">mobile</p>
      </div>

      <div class="status" id="status" data-phase="loading">
        <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <p class="msg" id="msg"></p>
        <a class="retry" id="retry" href="/login"></a>
      </div>
    </div>
    <p class="foot" id="hint"></p>
  </main>
<script>
(function () {
  var L = (navigator.language || 'zh').toLowerCase().slice(0, 2) === 'en' ? 'en' : 'zh';
  var T = {
    zh: {
      tag: '手机版',
      loading: '正在进入…',
      bad: '登录链接已失效，请回到电脑端重新扫码',
      missing: '缺少登录凭证，请通过电脑端生成二维码后扫码进入',
      neterr: '网络错误：',
      ok: '已就绪',
      retry: '重新登录',
      hint: '扫码链接仅可使用一次',
    },
    en: {
      tag: 'mobile',
      loading: 'Signing in…',
      bad: 'This link expired. Generate a new QR from desktop admin.',
      missing: 'Missing token. Scan a QR from admin → Mobile.',
      neterr: 'Network error: ',
      ok: 'Ready',
      retry: 'Sign in again',
      hint: 'QR links are single-use',
    },
  };
  var t = T[L];
  document.documentElement.lang = L === 'en' ? 'en' : 'zh-CN';
  document.getElementById('tag').textContent = t.tag;
  document.getElementById('hint').textContent = t.hint;
  document.getElementById('retry').textContent = t.retry;

  var statusEl = document.getElementById('status');
  var msg = document.getElementById('msg');
  var main = document.querySelector('main');

  function setPhase(phase, text) {
    statusEl.setAttribute('data-phase', phase);
    msg.textContent = text || '';
    if (main) main.setAttribute('aria-busy', phase === 'loading' ? 'true' : 'false');
  }

  function fail(text) {
    setPhase('err', text);
  }

  function next() {
    var p = new URLSearchParams(location.search);
    var n = p.get('next') || '/m/chat';
    try {
      var u = new URL(n, location.origin);
      if (u.origin !== location.origin) return '/m/chat';
      return u.pathname + u.search;
    } catch (e) {
      return '/m/chat';
    }
  }

  setPhase('loading', t.loading);

  var raw = new URLSearchParams(location.search).get('t');
  if (!raw) {
    fail(t.missing);
    return;
  }

  fetch('/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token: raw }),
  }).then(function (r) {
    if (r.status === 401) {
      fail(t.bad);
      return;
    }
    if (!r.ok) {
      return r.text().then(function (b) {
        fail(t.neterr + r.status + ' ' + b.slice(0, 160));
      });
    }
    try { localStorage.setItem('agim_token', raw); } catch (e) {}
    setPhase('ok', t.ok);
    setTimeout(function () { location.replace(next()); }, 420);
  }).catch(function (err) {
    fail(t.neterr + (err && err.message || String(err)));
  });
})();
</script>
</body>
</html>
