name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
  # Manual trigger — fallback when a publish was skipped.
  workflow_dispatch:
  # Called by Auto Version Bump after it pushes a bot version commit.
  # GitHub blocks github-actions[bot] pushes from triggering other workflows
  # on `push`, so without workflow_call the registry stays stale (e.g. npm
  # stuck at 1.5.21 while git advanced through 1.5.22–1.5.25).
  workflow_call:
    inputs:
      ref:
        description: 'Git ref/SHA to publish (bump commit). Empty = github.sha.'
        type: string
        required: false
        default: ''

permissions:
  id-token: write # npm Trusted Publishing (OIDC)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          # Prefer the bump SHA from workflow_call; otherwise the event SHA.
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          # Do not set registry-url here. setup-node would write
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into
          # ~/.npmrc, which forces classic-token auth and blocks OIDC
          # Trusted Publishing (npm then asks for OTP → EOTP).

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check publish needed
        id: version
        run: |
          CURR_VERSION=$(jq -r '.version' package.json)
          PUBLISHED_VERSION=$(npm view agim-cli version 2>/dev/null || echo "none")
          if [ "$PUBLISHED_VERSION" != "$CURR_VERSION" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "version=$CURR_VERSION" >> $GITHUB_OUTPUT
            echo "published=$PUBLISHED_VERSION" >> $GITHUB_OUTPUT
          else
            echo "npm already has v$CURR_VERSION."
          fi

      - name: Install dependencies
        if: steps.version.outputs.changed == 'true'
        # Use the Node-bundled npm — do NOT `npm install -g npm@latest`.
        # History: the arborist "Exit handler never called!" hang (npm 10 on
        # a large tree) was worked around by upgrading to npm@latest. But
        # `npm@latest` later shipped a broken tarball whose bundled `sigstore`
        # dep is missing, so `npm publish` aborted with
        # "Cannot find module 'sigstore'" (v1.5.9 / v1.5.10 push failures).
        # Node 24's bundled npm (11.x) has sigstore vendored AND predates the
        # arborist stall. The repaired public-registry lockfile now lets the
        # release use npm ci without a global npm upgrade.
        run: |
          npm --version
          npm ci --omit=optional --no-audit --no-fund --legacy-peer-deps
          BIOME_VERSION="$(node -p "require('./node_modules/@biomejs/biome/package.json').version")"
          BIOME_DIR="$RUNNER_TEMP/agim-biome"
          npm install --prefix "$BIOME_DIR" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org "@biomejs/cli-linux-x64@$BIOME_VERSION"
          test -f "$BIOME_DIR/node_modules/@biomejs/cli-linux-x64/biome"
          echo "BIOME_BINARY=$BIOME_DIR/node_modules/@biomejs/cli-linux-x64/biome" >> "$GITHUB_ENV"

      - name: Install web-app dependencies
        if: steps.version.outputs.changed == 'true'
        # src/web-app is a separate package (not a workspace), so the root
        # install doesn't reach it. The explicit typecheck below validates
        # TypeScript; the root build later runs Vite and packages its output.
        working-directory: src/web-app
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Backend typecheck
        if: steps.version.outputs.changed == 'true'
        run: npm run typecheck

      - name: Repository lint
        if: steps.version.outputs.changed == 'true'
        run: npm run lint

      - name: Backend tests
        if: steps.version.outputs.changed == 'true'
        run: npm test
        env:
          LOG_LEVEL: error

      - name: Web-app typecheck
        if: steps.version.outputs.changed == 'true'
        run: npm --prefix src/web-app run typecheck

      - name: Web-app i18n parity
        if: steps.version.outputs.changed == 'true'
        run: npm --prefix src/web-app run check-i18n

      - name: Web-app endpoint contracts
        if: steps.version.outputs.changed == 'true'
        run: npm run check:contracts

      - name: Web-app tests
        if: steps.version.outputs.changed == 'true'
        run: npm --prefix src/web-app test -- --run
        env:
          CI: 'true'

      - name: Build
        if: steps.version.outputs.changed == 'true'
        run: npm run build

      - name: SQLite persistence regressions
        if: steps.version.outputs.changed == 'true'
        run: npm run test:node

      - name: Publish to npm
        if: steps.version.outputs.changed == 'true'
        # Auth is npm Trusted Publishing via OIDC (`id-token: write`).
        # Do not set NODE_AUTH_TOKEN — a granular token now requires OTP
        # (EOTP) and also shadows the OIDC exchange.
        # `--provenance` stays off: this repo is private and the runner npm
        # used to abort on a missing `sigstore` when provenance auto-enabled.
        run: npm publish --access public
        env:
          NPM_CONFIG_PROVENANCE: 'false'

      - name: Summary
        if: steps.version.outputs.changed == 'true'
        run: |
          echo "✅ Published v${{ steps.version.outputs.version }} to npm" >> $GITHUB_STEP_SUMMARY
