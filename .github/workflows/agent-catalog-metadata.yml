name: Agent catalog metadata migration

on:
  pull_request:
    branches: [refactor/web-hook-stability]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: agent-catalog-metadata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    if: github.head_ref == 'refactor/agent-catalog-session'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply catalog metadata migration
        id: migrate
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 scripts/agent-catalog-metadata.py > /tmp/catalog-metadata.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            git diff --check >> /tmp/catalog-metadata.log 2>&1
            status=$?
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat /tmp/catalog-metadata.log
          exit 0

      - name: Report migration failure
        if: steps.migrate.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          {
            echo '<!-- agim-agent-catalog-metadata -->'
            echo '### Agent catalog metadata migration failed'
            echo
            echo '```text'
            tail -n 160 /tmp/catalog-metadata.log
            echo '```'
          } > /tmp/comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/comment.md

      - name: Commit migration
        if: steps.migrate.outputs.status == '0' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/registry.ts src/core/onboarding.ts \
            src/plugins/agents/antigravity/index.ts \
            src/plugins/agents/codex/index.ts \
            src/plugins/agents/opencode/adapter.test.ts \
            src/plugins/agents/opencode/opencode-http-adapter.ts \
            src/plugins/agents/cursor/index.ts \
            test/unit/agent-session-architecture.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'refactor(core): consume agent catalog metadata'
            git push origin HEAD:refactor/agent-catalog-session
          fi

      - name: Enforce migration
        if: steps.migrate.outputs.status != '0'
        run: exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install root dependencies
        shell: bash
        run: |
          npm ci --omit=optional --no-audit --no-fund --legacy-peer-deps --loglevel=error
          BIOME_VERSION=$(node -p "require('./node_modules/@biomejs/biome/package.json').version")
          npm install --no-save --no-package-lock --no-audit --no-fund --legacy-peer-deps --loglevel=error "@biomejs/cli-linux-x64@$BIOME_VERSION"

      - name: Install web-app dependencies
        run: npm --prefix src/web-app ci --no-audit --no-fund --legacy-peer-deps --loglevel=error

      - name: Backend typecheck
        run: npm run typecheck

      - name: Backend lint
        run: npm run lint:ci

      - name: Backend test
        run: npm test
        env:
          LOG_LEVEL: error

      - name: Web-app verify
        run: npm --prefix src/web-app run verify

      - name: Full build
        run: npm run build

      - name: Node-only memory regressions
        run: npm run test:node

      - name: Package contents smoke test
        run: npm pack --dry-run
