name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-hook-stability:
    if: github.head_ref == 'refactor/web-hook-stability'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Apply hook stability codemod
        id: codemod
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 scripts/hook-stability-codemod.py > .github/hook-stability-bootstrap.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            git diff --check >> .github/hook-stability-bootstrap.log 2>&1
            status=$?
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit codemod result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "${{ steps.codemod.outputs.status }}" = "0" ]; then
            rm -f .github/hook-stability-bootstrap.log
            git add src/web-app/src/hooks/use-chat.ts \
              src/web-app/src/routes/memory/facts.tsx \
              src/web-app/src/routes/memos.tsx \
              src/web-app/src/routes/observability/audit.tsx \
              src/web-app/src/routes/settings/email.tsx \
              src/web-app/src/routes/settings/viewer.tsx \
              biome.json
            if ! git diff --cached --quiet; then
              git commit -m 'refactor(web): stabilize effect dependencies'
              git push origin HEAD:refactor/web-hook-stability
            fi
          else
            git restore src/web-app/src/hooks/use-chat.ts \
              src/web-app/src/routes/memory/facts.tsx \
              src/web-app/src/routes/memos.tsx \
              src/web-app/src/routes/observability/audit.tsx \
              src/web-app/src/routes/settings/email.tsx \
              src/web-app/src/routes/settings/viewer.tsx \
              biome.json
            git add .github/hook-stability-bootstrap.log
            git commit -m 'chore: record hook codemod failure'
            git push origin HEAD:refactor/web-hook-stability
          fi

      - name: Enforce codemod
        if: steps.codemod.outputs.status != '0'
        run: exit 1

      - name: Install web-app dependencies
        run: npm --prefix src/web-app ci --no-audit --no-fund --legacy-peer-deps --loglevel=error

      - name: Web-app typecheck
        run: npm --prefix src/web-app run typecheck

      - name: Web-app lint
        run: npm --prefix src/web-app run lint:ci

      - name: Web-app test
        run: npm --prefix src/web-app test -- --run
        env:
          CI: 'true'
