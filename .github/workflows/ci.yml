name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install root dependencies
        shell: bash
        run: |
          npm ci --omit=optional --no-audit --no-fund --legacy-peer-deps --loglevel=error
          BIOME_VERSION=$(node -p "require('./node_modules/@biomejs/biome/package.json').version")
          npm install --no-save --no-package-lock --no-audit --no-fund --legacy-peer-deps --loglevel=error "@biomejs/cli-linux-x64@$BIOME_VERSION"
          test -f node_modules/@biomejs/cli-linux-x64/biome

      - name: Install web-app dependencies
        run: npm --prefix src/web-app ci --no-audit --no-fund --legacy-peer-deps --loglevel=error

      - name: Backend typecheck
        run: npm run typecheck

      - name: Backend lint
        run: npm run lint:ci

      - name: Backend test groups
        id: backend-groups
        continue-on-error: true
        shell: bash
        env:
          LOG_LEVEL: error
        run: |
          set +e
          failed=0
          : > /tmp/backend-groups.txt
          for group in test src/core src/plugins; do
            log="/tmp/$(echo "$group" | tr '/' '-').log"
            bun test "$group" --path-ignore-patterns='**/web-app/**' > "$log" 2>&1
            status=$?
            if [ "$status" -ne 0 ]; then
              {
                echo "=== FAILED GROUP: $group ==="
                tail -n 160 "$log"
                echo
              } >> /tmp/backend-groups.txt
              failed=1
            else
              echo "PASS $group" >> /tmp/backend-groups.txt
            fi
          done
          cat /tmp/backend-groups.txt
          exit "$failed"

      - name: Upload backend test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-groups
          path: /tmp/backend-groups.txt
          if-no-files-found: error
          retention-days: 1

      - name: Enforce backend test groups
        if: steps.backend-groups.outcome == 'failure'
        run: exit 1
