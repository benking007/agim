name: Agim
options:
  bundleIdPrefix: host.iclaw
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Agim:
    type: application
    platform: iOS
    sources:
      - path: Agim
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: host.iclaw.agim
        INFOPLIST_FILE: Agim/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
    info:
      path: Agim/Info.plist
      properties:
        CFBundleDisplayName: Agim
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Scan the Agim pairing QR code from the web console.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
  AgimTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AgimTests
    dependencies:
      - target: Agim
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: host.iclaw.agim.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Agim.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Agim"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Agim:
    build:
      targets:
        Agim: all
        AgimTests: [test]
    test:
      targets:
        - AgimTests
    run:
      config: Debug
